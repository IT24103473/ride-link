spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: fare-payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/ridelink_payment}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
  jackson:
    # Nulls are serialised rather than omitted. A documented-nullable field such as
    # a ride's driverId must come back as null, not vanish: an absent field leaves a
    # client unable to tell "no driver yet" from a misspelled field name.
    default-property-inclusion: always

server:
  port: 8084
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ridelink:
  security:
    jwt-secret: ${JWT_SECRET}
  fare:
    currency: LKR
    # Straight-line distance is multiplied by this to approximate road distance.
    road-winding-factor: 1.3
    # Assumed average city speed, used to derive the estimated duration.
    average-speed-kmh: 25
    estimate-validity-minutes: 15
    # Charged only when a PASSENGER cancels a ride that had reached ACCEPTED.
    cancellation-fee: 100.00
  # Tariffs live in configuration, never in Java, so pricing can change without
  # recompiling and the rule stays reviewable in one place.
  tariffs:
    TUK:
      base: 100.00
      per-km: 80.00
      per-min: 3.00
      minimum: 200.00
    CAR:
      base: 150.00
      per-km: 100.00
      per-min: 5.00
      minimum: 300.00
    VAN:
      base: 250.00
      per-km: 140.00
      per-min: 7.00
      minimum: 500.00

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
