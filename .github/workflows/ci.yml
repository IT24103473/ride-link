name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel the other services when one fails - we want the full picture.
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-vehicle-service
          - ride-service
          - fare-payment-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test ${{ matrix.service }}
        # No MySQL or RabbitMQ service containers: the test profile uses H2 and
        # disables the AMQP listeners, so the suite is hermetic and fast.
        run: ./mvnw -B -ntp -f ${{ matrix.service }}/pom.xml verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports
            ${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore
