# Test profile: no MySQL and no RabbitMQ required, so CI stays fast and hermetic.
spring:
  config:
    import: ""              # never read the developer's real .env during tests
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop  # tests build the schema directly; Flyway is off
    open-in-view: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false  # no broker in CI, so do not try to consume

ridelink:
  security:
    # TEST-ONLY dummy secret. Not a credential; never used outside tests.
    jwt-secret: test-only-secret-key-not-a-real-credential-32b
  matching:
    default-radius-km: 5
    max-radius-km: 20
    default-limit: 5
    location-freshness-minutes: 30
