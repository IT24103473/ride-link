spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: ride-service
  datasource:
    url: ${RIDE_DB_URL:jdbc:mysql://localhost:3306/ridelink_ride}
    username: ${RIDE_DB_USERNAME}
    password: ${RIDE_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
  jackson:
    # Nulls are serialised rather than omitted. A documented-nullable field such as
    # a ride's driverId must come back as null, not vanish: an absent field leaves a
    # client unable to tell "no driver yet" from a misspelled field name.
    default-property-inclusion: always

server:
  port: 8083
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ridelink:
  security:
    jwt-secret: ${JWT_SECRET}
  clients:
    account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
    driver-url: ${DRIVER_SERVICE_URL:http://localhost:8082}
    fare-url: ${FARE_SERVICE_URL:http://localhost:8084}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
    # Credentials this service presents to Account to obtain a SERVICE token.
    client-id: ${RIDE_SERVICE_CLIENT_ID:ride-service}
    client-secret: ${RIDE_SERVICE_CLIENT_SECRET:}
  assignment:
    # How many ranked candidates to attempt a reservation on before giving up.
    max-candidates: 3

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
